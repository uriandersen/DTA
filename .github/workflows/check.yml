name: DTA checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          for f in functions/api/*.js; do node --check "$f"; done
      - name: Verify critical files
        run: |
          test -s index.html
          test -s dta.html
          test -s functions/api/chat.js
          test -s functions/api/materials.js
