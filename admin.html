<!doctype html><html lang="da"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DTA Admin</title><style>
:root{--ink:#202020;--muted:#57534e;--line:#d4cfc7;--soft:#f0ede7}*{box-sizing:border-box}body{margin:0;background:#f3f1ed;font-family:Aptos,"Segoe UI",Arial,sans-serif;color:var(--ink)}main{max-width:980px;margin:36px auto;background:#fff;border-radius:8px;padding:30px;box-shadow:0 10px 36px rgba(55,48,40,.12)}h1{margin:0 0 24px;font-size:28px}.login,.bar,.group{background:var(--soft);border-radius:6px;padding:16px;margin-bottom:14px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.access-state{font-weight:700}.primary-action{width:90px;min-width:90px}.admin-action-row{display:grid;grid-template-columns:1fr 90px;gap:10px;align-items:center}.admin-action-row .primary-action,.admin-action-row>button{grid-column:2;width:90px;min-width:90px}.admin-action-row .status{grid-column:1}.material-row{display:grid!important;grid-template-columns:1fr 90px;gap:10px;align-items:center;position:relative;padding:7px 0}.material-row+ .material-row:before{content:"";position:absolute;top:0;left:14px;right:14px;border-top:1px solid var(--line)}.material-row button{grid-column:2;width:90px;min-width:90px}input,button{font:inherit;border:1px solid var(--line);border-radius:5px;padding:9px 11px}input{background:#fff;min-width:260px}button{background:#202020;color:#fff;font-weight:700;cursor:pointer}.secondary{background:#202020;color:#fff}.switch{position:relative;width:48px;height:26px;padding:0;border:0;border-radius:13px;background:#bbb;transition:.18s}.switch:after{content:"";position:absolute;width:42px;height:20px;left:3px;top:3px;border-radius:10px;background:#fff;transition:.18s}.switch.on{background:#202020}.switch.on:after{transform:translateX(42px)}.status{font-size:12px;color:var(--muted)}.groups{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.group{margin:0;background:#fff;border:1px solid var(--line)}.group h2{font-size:16px;margin:0 0 10px}.group small{display:block;color:var(--muted);min-height:34px;margin-bottom:12px}@media(max-width:700px){.groups{grid-template-columns:1fr}}</style></head><body><main><h1>DTA Admin</h1>
<div class="login"><div class="admin-action-row"><div><b id="loginLabel">Admin adgang</b> <span class="status access-state" id="loginStatus"></span><input id="key" type="password" placeholder="Admin-adgangskode"></div><button id="login" class="primary-action">LOG IND</button><button id="logout" class="primary-action" hidden>LOG UD</button></div></div>
<section id="panel" hidden><div class="bar"><div class="admin-action-row"><div><b>DTA adgang</b> <span id="access" class="status access-state"></span></div><button id="accessToggle" class="switch primary-action" type="button" role="switch" aria-checked="false" aria-label="Åbn eller luk DTA"></button></div></div>
<div class="bar"><div class="admin-action-row"><div><b>Skift adgangskode</b> &nbsp; <input id="newKey" type="password" placeholder="Ny adgangskode · min. 8 tegn"><span id="pwStatus" class="status"></span></div><button id="change" class="primary-action">SKIFT</button></div></div>
<div class="bar"><b>Fælles materiale</b><div class="status" style="margin:5px 0 10px">Upload én gang · tilgængeligt i alle grupper</div><div class="admin-action-row"><div><input id="courseFile" type="file" multiple><span id="courseStatus" class="status"></span></div><button id="courseUpload" class="primary-action">UPLOAD</button></div><div id="courseMaterials" style="margin-top:10px"></div></div>
<h2>Grupper</h2><div class="groups" id="groups"></div></section></main><script>
let key=localStorage.getItem('dta-admin-key')||'';const $=s=>document.querySelector(s);function auth(){return {authorization:'Bearer '+key}}async function api(url,opt={}){const r=await fetch(url,{...opt,headers:{...auth(),...(opt.headers||{})}});const d=await r.json();if(!r.ok)throw new Error(d.error||'Fejl');return d}
function bytes(n){if(!n)return'';if(n<1024*1024)return Math.round(n/1024)+' KB';return (n/1024/1024).toFixed(1)+' MB'}
async function refreshCourseMaterials(){
 const wrap=$('#courseMaterials');wrap.innerHTML='';
 try{const d=await api('/api/course-materials');(d.materials||[]).forEach(x=>{const row=document.createElement('div');row.className='material-row';row.style.marginTop='6px';const label=document.createElement('span');label.style.flex='1';label.textContent=x.name+(x.bytes?' · '+bytes(x.bytes):'');const del=document.createElement('button');del.className='secondary';del.textContent='FJERN';del.onclick=async()=>{await api('/api/course-materials?id='+encodeURIComponent(x.id),{method:'DELETE'});refreshCourseMaterials()};row.append(label,del);wrap.appendChild(row)})}catch(e){wrap.textContent=e.message}
}
async function uploadCourseFile(file){
 const fd=new FormData();fd.append('file',file,file.name);
 const r=await fetch('/api/materials',{method:'POST',headers:auth(),body:fd});const d=await r.json();if(!r.ok)throw new Error(d.error||'Upload-fejl');
 await api('/api/course-materials',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({name:file.name,fileId:d.file_id,mime:d.mime||file.type||'',bytes:file.size,kind:d.kind||'file'})});
}
async function refresh(){const a=await api('/api/admin-access');$('#access').textContent=a.enabled?'ÅBEN':'LUKKET';const t=$('#accessToggle');t.classList.toggle('on',a.enabled);t.setAttribute('aria-checked',String(!!a.enabled));t.dataset.enabled=String(!!a.enabled);await refreshCourseMaterials();const wrap=$('#groups');wrap.innerHTML='';for(const g of ['1','2','3']){let d={state:{}};try{d=await api('/api/group-state?group='+g)}catch{}const s=d.state||{};let mm=[];try{mm=(await api('/api/group-messages?group='+g)).messages||[]}catch{}const m=mm.length,sv=(s.saved||[]).length,mat=(s.materials||[]).length;const el=document.createElement('div');el.className='group';el.innerHTML='<h2>Gruppe '+g+'</h2><small>'+m+' beskeder · '+sv+' gemte · '+mat+' materialer</small><div class="row"><button class="secondary">ÅBN PROJEKT</button><button class="secondary">NULSTIL</button></div>';el.children[2].children[0].onclick=()=>{sessionStorage.setItem('dta-admin-key',key);window.open('/dta.html?group='+g+'&admin=1','_blank')};el.children[2].children[1].onclick=async()=>{if(confirm('Nulstil Gruppe '+g+'?')){await api('/api/group-state?group='+g,{method:'DELETE'});refresh()}};wrap.appendChild(el)}}
async function enterAdmin(){try{await refresh();localStorage.setItem('dta-admin-key',key);$('#panel').hidden=false;$('#key').value='';$('#login').hidden=true;$('#key').hidden=true;$('#logout').hidden=false;$('#loginStatus').textContent='ADGANG GODKENDT'}catch(e){localStorage.removeItem('dta-admin-key');key='';$('#loginStatus').textContent=e.message}}
$('#login').onclick=async()=>{key=$('#key').value;await enterAdmin()}
$('#logout').onclick=()=>{localStorage.removeItem('dta-admin-key');sessionStorage.removeItem('dta-admin-key');key='';$('#panel').hidden=true;$('#login').hidden=false;$('#key').hidden=false;$('#logout').hidden=true;$('#loginStatus').textContent='Logget ud'}
if(key)enterAdmin()
$('#accessToggle').onclick=async()=>{const enabled=$('#accessToggle').dataset.enabled==='true';await api('/api/admin-access',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({enabled:!enabled})});refresh()}
$('#change').onclick=async()=>{try{const n=$('#newKey').value;await api('/api/admin-access',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({newPassword:n})});key=n;localStorage.setItem('dta-admin-key',n);$('#key').value='';$('#newKey').value='';$('#pwStatus').textContent='Adgangskode ændret'}catch(e){$('#pwStatus').textContent=e.message}}
$('#courseUpload').onclick=async()=>{const files=[...$('#courseFile').files];if(!files.length)return;$('#courseStatus').textContent='Uploader…';try{for(const f of files)await uploadCourseFile(f);$('#courseFile').value='';$('#courseStatus').textContent='Tilføjet til alle grupper';await refreshCourseMaterials()}catch(e){$('#courseStatus').textContent=e.message}}
</script></body></html>
